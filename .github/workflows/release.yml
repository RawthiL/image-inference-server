# Build and publish the gateway image to GitHub Container Registry.
#
# - Release published (tag vX.Y.Z): test, then push
#     ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :latest (pre-releases skip the
#     :X.Y / :latest tags).
# - Manual run (Actions tab -> "Release image" -> Run workflow): test, then push
#     :<branch> and :sha-<short> for trying an unreleased build.
#
# The image contains only the gateway (MIT). Model weights are never baked
# in; operators mount their own Triton model repository (see README
# "Model licensing").
name: Release image

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Release tag matches Cargo version
        if: github.event_name == 'release'
        run: |
          cargo_version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::release tag '${GITHUB_REF_NAME}' does not match Cargo.toml workspace version '${cargo_version}'"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v10.2.0  # publishes full version tags only (no moving v10)
        with:
          enable-cache: true

      - name: Full test suite
        run: ./scripts/test-all.sh

  publish:
    name: Build and push image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry refs must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=image-inference-server gateway
            org.opencontainers.image.description=Model-agnostic, Ultralytics-compatible /predict gateway for Triton (Pocket Network backend)
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.gateway
          platforms: linux/amd64
          build-args: |
            FEATURES=yolo rfdetr
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
