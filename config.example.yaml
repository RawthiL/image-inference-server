# image-inference-server — gateway configuration
# Copy to config.yaml and edit. All values below are the defaults unless noted.

server:
  listen: "0.0.0.0:8080"        # gateway binds here; clients POST /predict

triton:
  url: "http://triton:8000"     # Triton HTTP endpoint (env TRITON_URL overrides;
                                # docker compose sets it to http://triton:8000)
  timeout_ms: 30000
  # Optional Bearer key if Triton sits behind an auth proxy. Leave unset when
  # Triton is network-internal.
  # api_key: "shared-secret"
  # Optional: Triton model name if it differs from default_model.
  # triton_model_name: "yolo26n"

# The single public model this deployment serves (a Triton model name). Any
# model exported by a backends/<family>/export.py works: the gateway reads the
# model's metadata from Triton at startup and selects the matching backend,
# so the /predict request and response are identical regardless of model.
# Check the model's license before serving it commercially (see README).
default_model: "rfdetr-base"    # e.g. yolo26n (AGPL-3.0, bring your license)

# Flat list of accepted Bearer API keys (one per client). A request is
# authorized if `Authorization: Bearer <key>` constant-time matches any entry.
api_keys:
  - "change-me-client-a"
  # - "change-me-client-b"

limits:
  max_upload_mb: 20
  url_timeout_ms: 10000         # when source is an http(s) URL
  allow_private_urls: false     # SSRF guard (DNS + redirects); true = dev only
  max_image_pixels: 40000000    # width*height cap, checked before decoding

defaults:
  conf: 0.25                    # applied when request omits `conf`
  iou: 0.7                      # accepted for API parity (NMS-free => unused)
  # decimals: 3                 # coordinate precision for pixel-space boxes
