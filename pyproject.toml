[project]
name = "image-inference-server"
version = "0.1.0"
description = "Tooling for a model-agnostic, Ultralytics-compatible /predict gateway (Rust) in front of Triton."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
# Per-backend export tooling (needs torch; heavy). One extra per backends/<family>.
# yolo: `ultralytics` is AGPL-3.0 — see backends/yolo/README.md.
yolo = ["ultralytics>=8.4.0", "onnx>=1.16", "onnxruntime>=1.18"]
rfdetr = ["rfdetr[onnx]>=1.6", "onnx>=1.16", "onnxruntime>=1.18"]
# ONNX-only helpers (fixture generation, mock Triton) — no torch.
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
test = ["pytest>=8.0", "onnx>=1.16", "onnxruntime>=1.18", "Pillow>=10.0"]

[tool.uv]
package = false
# onnxruntime stopped publishing Intel-macOS wheels after 1.23.
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
